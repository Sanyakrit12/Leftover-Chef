</head>

<body>

  <!-- NAVIGATION -->
  <header>
    <nav>
      <div class="logo">🍳 Leftover Chef</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="recipes.html">Recipes</a>
        <a href="ingredients.html">Find a Menu</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
      </div>
    </nav>
  </header>

  <!-- CONTACT SECTION -->
  <section class="contact-section">

    <!-- Background Decorative Shapes & Glowing Orbs -->
    <div class="decor-orb orb-1"></div>
    <div class="decor-orb orb-2"></div>
    <div class="decor-shape shape-circle-lg"></div>
    <div class="decor-shape shape-square"></div>
    <div class="decor-shape shape-ring"></div>
    <div class="decor-shape shape-dots"></div>

    <div class="contact-intro">
      <p class="subtitle">GET IN TOUCH</p>
      <h1>Contact Us</h1>
      <p>Have a question, suggestion, or recipe idea? We'd love to hear it.</p>
    </div>

    <!-- Main Card Container -->
    <div class="contact-card-container">
      <div class="contact-card-grid">
        <div class="contact-info-card">
          <div class="card-icon">👤</div>
          <div class="card-details">
            <span class="card-label">Name</span>
            <span class="card-value">Sanyakrit Micaraseth</span>
          </div>
        </div>

        <div class="contact-info-card">
          <div class="card-icon">🪪</div>
          <div class="card-details">
            <span class="card-label">Student ID</span>
            <span class="card-value">38497</span>
          </div>
        </div>

        <div class="contact-info-card">
          <div class="card-icon">🏫</div>
          <div class="card-details">
            <span class="card-label">Class</span>
            <span class="card-value">M.3/4</span>
          </div>
        </div>

        <div class="contact-info-card">
          <div class="card-icon">🔢</div>
          <div class="card-details">
            <span class="card-label">Number</span>
            <span class="card-value">12</span>
          </div>
        </div>
      </div>
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Leftover Chef · Turn leftovers into delicious meals.</p>
  </footer>
