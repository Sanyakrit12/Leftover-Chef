<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Leftover Chef</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- NAVIGATION -->

    <header>
        <nav>
    <div class="logo">🍳 Leftover Chef</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="recipes.html">Recipes</a>
        <a href="ingredients.html">Find a Menu</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
    </div>
</nav>
    </header>


    <!-- CONTACT -->

    <section class="contact-section">

        <div class="contact-intro">

            <p class="subtitle">
                GET IN TOUCH
            </p>

            <h1>
                Contact Us
            </h1>

            <p>
                Have a question, suggestion,
                or recipe idea? We'd love to hear it.
            </p>

        </div>


        <form class="contact-form">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Your name"
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="your@email.com"
            >


            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                rows="6"
                placeholder="Write your message..."
            ></textarea>


            <button type="submit">
                Send Message →
            </button>

        </form>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Leftover Chef · Turn leftovers into delicious meals.
        </p>

    </footer>

</body>

</html>
